name: Apply JamPlayer correctness fixes

on:
  push:
    branches:
      - main
    paths:
      - scripts/jamplayer-correctness.patch
      - .github/workflows/apply-jamplayer-correctness.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply patch
        run: |
          git apply --check scripts/jamplayer-correctness.patch
          git apply scripts/jamplayer-correctness.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JamPlayer regression tests
        run: npx vitest run lib/band-jam/engine/playback-state.test.ts lib/band-jam/engine/web-midi.test.ts

      - name: Type-check project
        run: npm run lint

      - name: Remove one-time migration files
        run: |
          rm scripts/jamplayer-correctness.patch
          rm .github/workflows/apply-jamplayer-correctness.yml

      - name: Commit validated fixes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/band-jam/practice-screen.tsx \
            lib/band-jam/engine/playback-state.ts \
            lib/band-jam/engine/playback-state.test.ts \
            scripts/jamplayer-correctness.patch \
            .github/workflows/apply-jamplayer-correctness.yml
          git commit -m "Fix JamPlayer playback synchronization"
          git push origin HEAD:main
