name: Apply remaining JamPlayer improvements

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-jamplayer-rest.py
      - scripts/.jamplayer-rest/fix
      - .github/workflows/apply-jamplayer-rest.yml

permissions:
  contents: write

concurrency:
  group: jamplayer-rest-main
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply, validate and publish
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -e
            python3 scripts/apply-jamplayer-rest.py
            npm ci
            npm run jam-player:build-shards
            npm run jam-player:check
            npx vitest run \
              lib/band-jam/engine/*.test.ts \
              lib/band-jam/catalog-loader.test.ts \
              components/band-jam/player-panel-dialog.test.tsx
            npm run lint
          } 2>&1 | tee /tmp/jamplayer-validation.log
          status=${PIPESTATUS[0]}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            mkdir -p docs
            cp /tmp/jamplayer-validation.log docs/jamplayer-validation-failure.log
            git add docs/jamplayer-validation-failure.log
            git diff --cached --quiet || git commit -m "Record JamPlayer validation failure" -- docs/jamplayer-validation-failure.log
            git push origin HEAD:main
            exit "$status"
          fi

          rm -f docs/jamplayer-validation-failure.log
          rm scripts/apply-jamplayer-rest.py
          rm .github/workflows/apply-jamplayer-rest.yml
          rm -rf scripts/.jamplayer-rest
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete JamPlayer architecture and performance improvements"
          git push origin HEAD:main
