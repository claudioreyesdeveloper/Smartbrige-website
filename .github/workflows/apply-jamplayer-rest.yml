name: Apply remaining JamPlayer improvements

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-jamplayer-rest.py
      - .github/workflows/apply-jamplayer-rest.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed source bundle
        run: python3 scripts/apply-jamplayer-rest.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate JamPlayer data shards
        run: |
          npm run jam-player:build-shards
          npm run jam-player:check

      - name: Run JamPlayer and engine tests
        run: >-
          npx vitest run
          lib/band-jam/engine/*.test.ts
          lib/band-jam/catalog-loader.test.ts
          components/band-jam/player-panel-dialog.test.tsx

      - name: Type-check project
        run: npm run lint

      - name: Remove one-time migration files
        run: |
          rm scripts/apply-jamplayer-rest.py
          rm .github/workflows/apply-jamplayer-rest.yml
          rm -rf scripts/.jamplayer-rest

      - name: Commit validated improvements to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete JamPlayer architecture and performance improvements"
          git push origin HEAD:main
